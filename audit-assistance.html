<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Meet the dedicated Audit Assistants at CS Hariharan & Co LLP.">
    <title>Audit Assistance | CS HARIHARAN & CO LLP</title>
    <link rel="icon" type="image/png" href="/caindialogo.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Global Header Placeholder -->
    <div id="header-placeholder"></div>

    <main>
        <div class="page-header fade-up">
            <h1 class="page-title">Audit Assistance</h1>
            <p class="page-subtitle">The dedicated professionals executing our rigorous compliance standards.</p>
        </div>

        <section class="section-container">
            <!-- The JavaScript Engine will inject all the static cards into this grid -->
            <div class="experts-grid" id="assistants-grid"></div>
        </section>
    </main>

    <!-- Global Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Global Logic -->
    <script src="/script.js" defer></script>

    <!-- Dynamic ES6 Render Engine (Static Cards) -->
    <script>
        // 1. Audit Assistants Database
        // Update names, roles, education, and image links here.
        const assistantsData = [
            {
                id: 'assistant-1',
                name: 'Name',
                role: 'Audit Assistant',
                education: 'B.Com, CA Finalist',
                imageSrc: '/john.jpg'
            },
            {
                id: 'assistant-2',
                name: 'Name',
                role: 'Audit Assistant',
                education: 'B.Com, CA Inter',
                imageSrc: '/jane.jpg'
            },
            {
                id: 'assistant-3',
                name: 'Name',
                role: 'Articled Assistant',
                education: 'B.Com, CA Inter',
                imageSrc: '/michael.jpg'
            },
            {
                id: 'assistant-4',
                name: 'Name',
                role: 'Articled Assistant',
                education: 'B.B.A, CA Inter',
                imageSrc: '/priya.jpg'
            }
        ];

        // 2. The ES6 Render Function
        function renderAssistants() {
            const grid = document.getElementById('assistants-grid');
            
            // Loop through the array and generate the HTML blocks
            const htmlContent = assistantsData.map((assistant, index) => {
                
                // Calculates a staggered animation delay (1 to 4) so cards load in smoothly
                const delayClass = `delay-${(index % 4) + 1}`;

                return `
                <div class="expert-card fade-up ${delayClass}" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <img src="${assistant.imageSrc}" alt="${assistant.name}" class="expert-avatar-img" onerror="this.src='/caindialogo1.webp'" style="margin-bottom: 16px;">
                    <h3 class="expert-name" style="font-size: 18px; font-weight: 800; color: var(--color-secondary); margin-bottom: 4px;">${assistant.name}</h3>
                    <p class="expert-role" style="font-size: 14.5px; font-weight: 700; color: var(--color-primary); margin-bottom: 4px;">${assistant.role}</p>
                    <p class="expert-edu" style="font-size: 13.5px; color: var(--color-text-muted); font-weight: 600;">${assistant.education}</p>
                </div>`;
            }).join(''); // Connects all generated cards into one string

            // Inject the string into the HTML file
            grid.innerHTML = htmlContent;
        }

        // 3. Build the page on load
        renderAssistants();
    </script>
</body>
</html>
