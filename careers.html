<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Read expert financial insights, tax compliance updates, and corporate advisory articles from CS Hariharan & Co LLP.">
    <title>Careers | CS HARIHARAN & CO LLP</title>
        <link rel="icon" type="image/png" href="/caindialogo.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div id="header-placeholder"></div>

    <main>
        <div class="page-header fade-up">
            <h1 class="page-title">Join Our Team</h1>
        </div>

        <section class="section-container fade-up delay-1">
            <div class="careers-intro">
                <h2 style="margin-bottom: 16px;">- Apply Here -</h2>
                <p>We nurture and cultivate a sense of pride in the work and create team leaders. Your growth chart will be governed by well-defined transparent policies of the firm. Apply via the form given below and meet us for a face-to-face interview.</p>
            </div>

<!-- FORM START -->
            <form action="https://formsubmit.co/caspraveenkumars@gmail.com" method="POST" enctype="multipart/form-data">
                <div class="form-grid">
                    
                    <div class="form-group">
                        <label class="form-label">First name <span style="color:red;">*</span></label>
                        <input type="text" name="First Name" class="form-input" pattern="[A-Za-z\s]{2,50}" title="Only alphabets and spaces allowed (min 2 characters)" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Last name <span style="color:red;">*</span></label>
                        <input type="text" name="Last Name" class="form-input" pattern="[A-Za-z\s]{1,50}" title="Only alphabets and spaces allowed" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email <span style="color:red;">*</span></label>
                        <input type="email" name="Email" class="form-input" pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" title="Please enter a valid email address (e.g., name@domain.com)" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Mobile No <span style="color:red;">*</span></label>
                        <input type="tel" name="Mobile No" class="form-input" pattern="[0-9]{10}" maxlength="10" minlength="10" title="Please enter a valid 10-digit mobile number" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Gender <span style="color:red;">*</span></label>
                        <select name="gender" class="form-select" required>
                            <option value="">Select..</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Position you are applying for <span style="color:red;">*</span></label>
                        <select name="position" class="form-select" required>
                            <option value="">Select Position..</option>
                            <option value="Articled Assistant">Article Assistant</option>
                            <option value="Audit Executive">Audit Executive</option>
                            <option value="Tax Consultant">Tax Consultant</option>
                            <option value="Senior Manager">Senior Manager</option>
                            <option value="Administrative Staff">Administrative Staff</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Date Of Birth <span style="color:red;">*</span></label>
                        <input type="date" name="Date Of Birth" class="form-input" max="2008-12-31" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Highest Qualification</label>
                        <input type="text" name="qualification" class="form-input" placeholder="e.g. CA, CMA, B.Com, MBA">
                    </div>

                    <div class="form-group">
                        <label class="form-label">LinkedIn Profile URL</label>
                        <input type="url" name="linkedin" class="form-input" placeholder="https://linkedin.com/in/...">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Upload Resume <span style="color:red;">*</span> <span style="font-size: 12px; color: var(--color-text-light); font-weight: 500;">(Max size 1MB, PDF/DOCX)</span></label>
                        <div class="file-upload-wrapper">
                            <input type="file" name="attachment" class="file-input" accept=".pdf,.doc,.docx" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Last company you worked for</label>
                        <input type="text" name="lastCompany" class="form-input">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Years Of Experience</label>
                        <div class="exp-group">
                            <select name="expYears" class="form-select">
                                <option value="">Select Year</option>
                                <option value="0">0 Years</option>
                                <option value="1">1 Year</option>
                                <option value="2">2 Years</option>
                                <option value="3">3 Years</option>
                                <option value="4">4+ Years</option>
                            </select>
                            <select name="expMonths" class="form-select">
                                <option value="">Select Month</option>
                                <option value="0">0 Months</option>
                                <option value="3">3 Months</option>
                                <option value="6">6 Months</option>
                                <option value="9">9 Months</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label class="form-label">Reference / Comments / Questions</label>
                        <textarea name="comments" class="form-textarea"></textarea>
                    </div>

                    <div class="form-group full-width" style="align-items: center; margin-top: 16px;">
                        <button type="submit" class="btn btn-primary" style="min-width: 200px;">Send Application</button>
                    </div>
                </div>
            </form>
            <!-- FORM END -->

        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="script.js" defer></script>
</body>
</html>
